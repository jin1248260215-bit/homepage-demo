<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>个人日历 · Windysunny</title><meta name="description" content="添加生日、纪念日和重要约定。你的日历仅保存在当前浏览器。"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script><script src="/calendar.js" defer></script></head><body data-page="calendar"><a class="skip" href="#main">跳到主要内容</a><div id="shell"></div><main id="main" class="main"><header class="page-head"><div><p class="eyebrow">MAKE ROOM FOR WHAT MATTERS</p><h1>个人日历<span class="heading-dot">.</span></h1><p class="muted">重要的日子，认真记下来。</p></div><button class="button" id="new-event" type="button"><span aria-hidden="true">＋</span> 添加重要日期</button></header><div class="calendar-layout"><section class="calendar-panel card" aria-label="月历"><div class="calendar-toolbar"><div class="month-selectors"><label class="sr-only" for="year-select">年份</label><select id="year-select" aria-label="年份"></select><label class="sr-only" for="month-select">月份</label><select id="month-select" aria-label="月份"></select></div><div class="month-controls"><button class="icon-button" id="prev-month" type="button" aria-label="上个月">‹</button><button class="button secondary today-button" id="go-today" type="button">今天</button><button class="icon-button" id="next-month" type="button" aria-label="下个月">›</button></div></div><div class="calendar-weekdays" aria-hidden="true"><span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>周日</span></div><div id="calendar-grid" class="calendar-grid" aria-label="选择日期"></div><div class="calendar-legend"><span><i class="legend-dot today-dot"></i>今天</span><span><i class="legend-dot event-dot"></i>有重要日期</span><span class="calendar-hint">选择一天，查看或添加记录</span></div></section><aside class="day-panel card"><p class="eyebrow">ON THIS DAY</p><h2 id="selected-heading"></h2><p id="selected-weekday" class="muted"></p><div id="day-events"></div><button class="button secondary add-day" id="add-day" type="button">＋ 为这天添加记录</button><div class="privacy-note"><strong>只属于当前浏览器</strong><p>记录不会公开，也不会上传。更换设备、浏览器或清除网站数据后，记录不会自动恢复。</p></div></aside></div><section class="month-agenda"><div class="section-line section-space"><div><p class="eyebrow">IMPORTANT DATES</p><h2>本月的重要日期</h2></div><span id="month-count" class="small-label"></span></div><div id="month-events" class="month-events"></div></section><footer class="page-footer"><span>Windysunny 的个人空间</span><span>日历记录仅保存在当前浏览器 · 不发送系统提醒</span></footer></main><dialog id="event-dialog" aria-labelledby="dialog-title"><form id="event-form"><div class="dialog-head"><div><p class="eyebrow">A DATE TO REMEMBER</p><h2 id="dialog-title">添加重要日期</h2></div><button type="button" class="icon-button close-dialog" aria-label="关闭">×</button></div><input type="hidden" name="id"><label class="field">事项名称 <span class="required-mark">*</span><input name="title" required maxlength="80" placeholder="例如：生日、考试、重要约定" autocomplete="off"></label><div class="form-row"><label class="field">日期 <span class="required-mark">*</span><input name="date" type="date" required min="1900-01-01" max="2100-12-31"></label><label class="field">时间 <span class="optional">选填</span><input name="time" type="time"></label></div><label class="field">分类<select name="category" aria-label="分类"><option>个人</option><option>生日</option><option>学习</option><option>约定</option><option>纪念日</option></select></label><label class="field">备注 <span class="optional">选填</span><textarea name="note" rows="3" maxlength="500" placeholder="还有什么需要记住的？"></textarea></label><p id="form-error" class="form-error" role="alert"></p><p class="form-hint">保存到当前浏览器，不会公开。</p><div class="dialog-actions"><button type="button" class="button secondary close-dialog">取消</button><button type="submit" class="button">保存日期</button></div></form></dialog><dialog id="delete-dialog" aria-labelledby="delete-title"><div class="dialog-head"><h2 id="delete-title">删除这条记录？</h2><button type="button" class="icon-button close-delete" aria-label="关闭">×</button></div><p id="delete-description"></p><p class="muted delete-hint">删除后无法恢复。</p><p id="delete-error" class="form-error" role="alert"></p><div class="dialog-actions"><button type="button" class="button secondary close-delete">保留记录</button><button type="button" class="button danger" id="confirm-delete">删除记录</button></div></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div><noscript><p class="no-js">请启用 JavaScript，以查看日历和保存重要日期。</p></noscript></body></html>
